      git clone --mirror https://git.sr.ht/~gpanders/gpanders.com
      git -C gpanders.com.git push --force --mirror git@github.com:gpanders/gpanders.com
      git -C gpanders.com.git push --force --mirror git@codeberg.org:gpanders/gpanders.com

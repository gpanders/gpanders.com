title: vim-oldfiles
summary: Improve Vim's native recent file history
href: https://github.com/gpanders/vim-oldfiles
description: >
  `vim-oldfiles` is a simple Vim plugin that aims to enhance native Vim
  functionality in a way that fits into the Vim paradigm. It improves Vim's
  built-in `:oldfiles` command by leveraging Vim's quickfix list and by
  updating the oldfiles list while the Vim session is active.

{{ define "main" }}

<ul class="entry-list">
  {{ range sort hugo.Data.talks "date" "desc" }}
    <li class="h-event">
      {{ with .date | time.AsTime }}
        <time class="dt-start" datetime="{{ .Format "2006-01-02" }}">{{ .Format "2006-01-02" }}</time>
      {{ end }}
      <div>
        <a class="p-name u-url" href="{{ .href }}">{{ .title }}</a>
        {{ with .context }}<p class="entry-note">{{ . }}</p>{{ end }}
      </div>
    </li>
  {{ end }}
</ul>

{{ end }}

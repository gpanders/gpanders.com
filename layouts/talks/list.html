{{ define "main" }}

{{ range .Site.Data.talks }}
  <p class="heading p-name"><a href="{{ .href }}">{{ .title }}</a></p>
  <span class="subheading">
    {{ if .context }}
      {{ .context }}
      •
    {{ end }}
    {{ with .date | time.AsTime }}
    <time class="dt-published" datetime="{{ .Format "2006-01-02T15:04:05Z07:00" }}">
      {{ .Format "January 2, 2006" }}
    </time>
    {{ end }}
  </span>
{{ end }}

{{ end }}

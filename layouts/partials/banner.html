<nav class="u-background">
  <div class="u-wrapper">
    <ul class="Banner">
      <li class="Banner-item Banner-item--title">
        <a class="Banner-link u-clickable" href="{{ "" | absURL }}">{{ site.Title }}</a>
      </li>
      <li class="Banner-item">
        <form class="Search-form" role="search" action="/search" method="GET" accept-charset="UTF-8">
	  <label>
	    <input name="q" aria-label="Search" class="Search-input" placeholder="Search…" tabindex="0">
	  </label>
        </form>
      </li>
      {{ range site.Menus.nav }}
      <li class="Banner-item">
        <a class="Banner-link u-clickable" href="{{ .URL | absURL }}">{{ .Name }}</a>
      </li>
      {{ end }}
    </ul>
  </div>
</nav>

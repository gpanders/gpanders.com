{{ $paginator := .Scratch.Get "paginator" }}

{{ if gt $paginator.TotalPages 1 }}
  <nav class="Pagination">
    {{ with $paginator.Prev }}
      <a href="{{ .URL }}" rel="prev">« Previous</a>
    {{ end }}
    {{ with $paginator.Next }}
      <a href="{{ .URL }}" rel="next">Next »</a>
    {{ end }}
  </nav>
{{ end }}

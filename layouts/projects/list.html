{{ define "main" }}

{{ .Content }}

{{ range where .Pages ".Params.featured" "eq" true  }}
  <p class="heading p-name"><a href="{{ .Param "href" }}">{{ .Title }}</a></p>
  {{ if .Content }}
    <details>
      <summary class="subheading">{{ .Summary }}</summary>
      <p>{{ .Content }}</p>
    </details>
  {{ else }}
    {{ with .Summary }}
      <p class="subheading">{{ . }}</p>
    {{ end }}
  {{ end }}
{{ end }}

{{ end }}

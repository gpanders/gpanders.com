{{ define "main" }}

{{ range .Site.Data.projects }}
  {{ if .featured }}
    <p class="heading p-name"><a href="{{ .href }}">{{ .title }}</a></p>
    {{ if .description }}
      <details>
        <summary class="subheading">{{ .summary }}</summary>
        <p>{{ .description | markdownify }}</p>
      </details>
    {{ else }}
      {{ with .summary }}
        <p class="subheading">{{ . }}</p>
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}

{{ end }}

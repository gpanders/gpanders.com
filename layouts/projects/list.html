{{ define "main" }}

<ul class="project-list">
  {{ range hugo.Data.projects }}
    {{ if .featured }}
      <li>
        <a class="p-name" href="{{ .href }}">{{ .title }}</a>
        {{ if .description }}
          <details>
            <summary class="entry-note">{{ .summary }}</summary>
            <div class="e-content">{{ .description | markdownify }}</div>
          </details>
        {{ else }}
          {{ with .summary }}<p class="entry-note">{{ . }}</p>{{ end }}
        {{ end }}
      </li>
    {{ end }}
  {{ end }}
</ul>

{{ end }}

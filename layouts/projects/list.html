{{ define "main" }}

{{ partial "heading.html" . }}
{{ .Content }}
<ul class="List">
  {{ range .Pages }}
  <li class="List-item">
    <h2 class="List-link"><a href="{{ with .Params.href }}{{ . }}{{ else }}{{ .RelPermalink }}{{ end }}">{{ .Title }}</a></h2>
    <p>{{ .Summary }}</p>
  </li>
  {{ end }}
</ul>

{{ end }}

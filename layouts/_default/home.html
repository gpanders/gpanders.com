{{ define "main" }}

<h1>Hello!</h1>

{{ .Content }}

<h2>Featured Posts</h2>
<ul class="Featured">
{{ $posts := where .Site.RegularPages "Section" "blog" }}
{{ range sort (where $posts ".Params.featured" true) "Title" }}
  <li class="Featured-item"><a class="Featured-link" href="{{ .Permalink }}">{{ .Title }}</a></li>
{{ end }}
</ul>

{{ end }}

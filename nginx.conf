server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name gpanders.com;

	add_header Content-Security-Policy "default-src 'self'; object-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' https://asciinema.org";
	add_header X-Content-Type-Options "nosniff";
	add_header X-Frame-Options "SAMEORIGIN";

	location ~ /posts/(.*)$ {
		return 301 $scheme://$server_name/blog/$1;
	}

	location / {
		root /var/www/gpanders.com;

		location = /index.xml {
			add_header Content-Type "application/xml; charset=utf-8";
			add_header Cache-Control "max-age=3600";
		}
	}
}

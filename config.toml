baseURL = "https://gpanders.com"
locale = "en-US"
title = "g.p. anders"
enableGitInfo = true
pluralizeListTitles = false
pygmentsUseClasses = true
copyright = "Content on this site is licensed CC BY-SA 4.0"
timeZone = "UTC"

[taxonomies]

# search-index.json is bundled into the search Worker (src/index.ts) and is
# excluded from the public assets by static/.assetsignore.
[outputFormats.SearchIndex]
mediaType = "application/json"
baseName = "search-index"
isPlainText = true
notAlternative = true

[outputs]
home = ["HTML", "RSS", "SearchIndex"]

[params]
css = ["css/syntax/light.css", "css/syntax/dark.css"]
description = "Personal website for Gregory Anders"
width = "65rem"

[params.author]
name = "Gregory Anders"
email = "contact@gpanders.com"
homepage = "https://gpanders.com"

[[menu.nav]]
name = "Blog"
url = "/"
weight = 1

[[menu.nav]]
name = "Talks"
url = "/talks"
weight = 2

[[menu.nav]]
name = "About"
url = "/about"
weight = 3

[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "node_modules/@sveltia/cms/dist"
    target = "static/_admin"
    files = ["sveltia-cms.js"]

baseURL = "https://gpanders.com"
locale = "en-US"
title = "g.p. anders"
enableGitInfo = true
pluralizeListTitles = false
pygmentsUseClasses = true
copyright = "Content on this site is licensed CC BY-SA 4.0"
timeZone = "UTC"

[taxonomies]

# Content is plain Markdown so it round-trips through the CMS. Render hooks in
# layouts/_default/_markup handle figures, videos, links, and math.
[markup.goldmark.renderer]
unsafe = true # allow inline HTML, e.g. colored <span>s in state-of-the-terminal

[markup.goldmark.parser]
wrapStandAloneImageWithinParagraph = false

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)']]

[outputFormats.json]
notAlternative = true

[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
css = ["css/syntax/light.css", "css/syntax/dark.css"]
description = "Personal website for Gregory Anders"

[params.author]
name = "Gregory Anders"
email = "contact@gpanders.com"
homepage = "https://gpanders.com"

[[menu.nav]]
name = "Blog"
url = "/"
weight = 1

[[menu.nav]]
name = "Talks"
url = "/talks"
weight = 2

[[menu.nav]]
name = "About"
url = "/about"
weight = 3

[module]
[[module.mounts]]
source = "static"
target = "static"
[[module.mounts]]
source = "node_modules/@sveltia/cms/dist"
target = "static/_admin"
files = ["sveltia-cms.js"]

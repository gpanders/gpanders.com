[build]
  publish = "public"
  command = "hugo --minify"

[[redirects]]
  from = "/posts/*"
  to = "/blog/:splat"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' *.gpanders.com"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
